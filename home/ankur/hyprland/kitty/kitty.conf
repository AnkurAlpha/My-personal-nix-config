# kitty config made to closely match foot configs

# --- shell ---
shell fish

# --- font ---
font_family JetBrainsMonoNL Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 16

linux_display_server wayland

# --- window look ---
background_opacity 0.65
dynamic_background_opacity no

# foot pad=0x0 equivalent
window_padding_width 0
single_window_padding_width 0
window_margin_width 0
single_window_margin_width 0

# foot has no visible tab bar; hide kitty tab bar
tab_bar_style hidden

# keep normal window decorations
hide_window_decorations no

# --- scrollback ---
scrollback_lines 1000

# --- cursor ---
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# --- colors  ---
foreground #f8f8f2
background #000001

color0  #000000
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #bfbfbf

color8  #4d4d4d
color9  #ff6e67
color10 #5af78e
color11 #f4f99d
color12 #caa9fa
color13 #ff92d0
color14 #9aedfe
color15 #e6e6e6

# optional: dracula-like cursor colors
# cursor #f8f8f2
# cursor_text_color #000000

# --- url handling ---
open_url_with default
url_style curly

# --- bell ---
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

# --- shell integration ---
shell_integration enabled

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+kp_add change_font_size all +2.0

map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+kp_subtract change_font_size all -2.0

map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

map ctrl+shift+n new_os_window_with_cwd

# prompt prev/next like foot
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

# keyboard URL opener
map ctrl+shift+u open_url_with_hints


# Add cursor trails in kitty
cursor_trail 1
cursor_trail_decay 0.15 0.5
cursor_trail_start_threshold 1
cursor_trail_color none
