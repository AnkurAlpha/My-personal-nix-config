
# Garuda-inspired Hyprlock configuration

general {
    hide_cursor = false
}

animations {
    enabled = true
}

background {
    monitor =
    path = screenshot
    color = rgba(16, 16, 20, 1.0)
    blur_passes = 2
    brightness = 0.5
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(236, 240, 15, 1)
    inner_color = rgba(240, 204, 14, 1)
    font_color = rgb(0, 0, 0)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i>Input Password...</i>
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrainsMonoNL Nerd Font Mono
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrainsMonoNL Nerd Font Mono
    position = 0, 200
    halign = center
    valign = center
}

